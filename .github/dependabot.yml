version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    rebase-strategy: auto
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-dev:
        patterns: ["*"]
        exclude-patterns: ["llvmlite"]
      llvm:
        patterns: ["llvmlite"]
    ignore:
      # llvmlite is tied to the LLVM version used by the backend; a major bump needs
      # a deliberate migration and a backend test run, not an automatic update.
      - dependency-name: llvmlite
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/site"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    rebase-strategy: auto
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(site)"
    groups:
      site:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    rebase-strategy: auto
    labels: ["dependencies"]
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
