name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sincronizar dependências (Python vem do .python-version)
        run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Tipos
        run: uv run mypy

      - name: Testes
        run: uv run pytest

# Benchmarks ficam fora do CI: tempo de runner é ruidoso demais para gate.
# Rode `make bench` localmente antes de abrir PR que mexe em performance.
