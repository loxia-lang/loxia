name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups --extra llvm
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv lock --check
      - run: uv run pre-commit validate-config

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups --extra llvm
      - run: uv run mypy

  unit:
    name: Unit (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-groups --extra llvm
      - name: Unit tests
        if: matrix.python != '3.13'
        run: uv run pytest -m "not backend and not install"
      - name: Unit tests + coverage ratchet
        if: matrix.python == '3.13'
        run: make coverage-ratchet

  portable-macos:
    name: Portable (macOS)
    # Interpreter-only coverage; the native backend remains Linux-only.
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked --all-groups --extra llvm
      - name: Non-backend suite
        run: uv run pytest -m "not backend and not install" --maxfail=20 -ra

  portable-windows:
    name: Portable (Windows, experimental)
    # Known platform failures: this job is informational until the interpreter
    # is ported. It is intentionally not part of ci-success.
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked --all-groups --extra llvm
      - name: Non-backend suite
        id: suite
        continue-on-error: true
        run: uv run pytest -m "not backend and not install" --maxfail=20 -ra
      - name: Note experimental failures
        if: steps.suite.outcome == 'failure'
        shell: bash
        run: echo "::warning title=Windows portable CI::known platform failures; see the suite log."

  backend:
    name: Native backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install Boehm GC
        run: sudo apt-get update && sudo apt-get install -y libgc-dev
      # Instala o toolchain pinado ANTES do pytest: com xdist, vários workers
      # disparam o rustup ao mesmo tempo e a instalação pode ficar pela metade
      # ("missing manifest in toolchain"), como aconteceu no CI.
      - name: Install Rust toolchain
        run: rustup toolchain install 1.93.1 --profile minimal --no-self-update
      # A suíte cargo do crate é a única guarda do catch_unwind/panic hook e do free.
      - name: Rust tests (regex ABI)
        working-directory: native/regex
        run: cargo test --release --locked --offline
      - name: Cache the runtime build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lox-build-cache
          key: lox-runtime-${{ runner.os }}-${{ hashFiles('runtime/**', 'loxia_core/backend/**', 'pyproject.toml') }}
          restore-keys: |
            lox-runtime-${{ runner.os }}-
      - run: uv sync --locked --all-groups --extra llvm
      - name: Backend suite + coverage ratchet
        env:
          LOX_REQUIRE_LLVM: "1"
          LOX_BUILD_CACHE: ${{ runner.temp }}/lox-build-cache
        run: make coverage-ratchet-backend

  docs:
    name: Docs and generated files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups --extra llvm
      - run: uv run python docs/_hooks/levels.py --check
      - run: uv run python docs/_hooks/codes.py --check
      - run: uv run python docs/_hooks/stdlib.py --check
      - run: uv run python editors/build_grammar.py --write
      - run: git diff --exit-code
      - run: uv run pytest tests/test_docs_links.py tests/test_docs_consistency.py

  site:
    name: Documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: uv sync --locked --all-groups --extra llvm
      - run: npm ci --prefix site
      - run: npm run build --prefix site
      - run: uv run python tools/docs_links.py --strict
      - run: uv run python tools/docs_i18n.py --strict

  package:
    name: Build and install wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups --extra llvm
      - run: uv build
      # Policia o layout do artefato (std/ uma vez só) e a instalação fora do repo.
      - run: uv run pytest -m install
      - run: uv run --with twine twine check dist/*
      - run: uv venv /tmp/lox-venv
      - run: uv pip install --python /tmp/lox-venv/bin/python dist/*.whl
      - run: /tmp/lox-venv/bin/loxia --version
      - run: /tmp/lox-venv/bin/python -c "import loxia, loxia_core; print(loxia.__version__)"

  commits:
    name: Commits and DCO
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Conventional PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 -m tools.check_pr_title
      - name: Developer Certificate of Origin
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/check_dco.py
      # Dogfood do `regex` (ADR-0131). O check em Python acima continua até este
      # rodar verde por um release. O runner já traz Rust; o primeiro run compila
      # o motor (~15 s, cacheado por conteúdo).
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install Rust toolchain
        run: rustup toolchain install 1.93.1 --profile minimal --no-self-update
      - name: Conventional PR title (Loxia, dogfood)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: uv run main.py tools/check_pr_title.lx

  ci-success:
    name: CI success
    if: always()
    needs: [lint, typecheck, unit, portable-macos, backend, docs, site, package, commits]
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All required jobs passed or were skipped"
