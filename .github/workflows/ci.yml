name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sincronizar dependências (Python vem do .python-version)
        run: uv sync --all-groups

      - name: "Qualidade (pre-commit: ruff + mypy + pytest)"
        run: uv run pre-commit run --all-files --show-diff-on-failure

# Benchmarks ficam fora do CI: tempo de runner é ruidoso demais para gate.
# Rode `make bench` localmente antes de abrir PR que mexe em performance.
