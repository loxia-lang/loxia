name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sincronizar dependências (Python vem do .python-version)
        run: uv sync --all-groups --extra llvm

      # O backend nativo usa Boehm (ADR-0074). O runner não traz libgc por padrão.
      - name: Instalar libgc (Boehm)
        run: sudo apt-get update && sudo apt-get install -y libgc-dev

      # O backend nativo é opcional para quem usa, mas obrigatório no CI: se o
      # llvmlite ou a libgc faltarem, os testes do backend falham em vez de pular.
      - name: "Qualidade (pre-commit: ruff + mypy + pytest)"
        env:
          LOX_REQUIRE_LLVM: "1"
        run: uv run pre-commit run --all-files --show-diff-on-failure

# Benchmarks ficam fora do CI: tempo de runner é ruidoso demais para gate.
# Rode `make bench` localmente antes de abrir PR que mexe em performance.
