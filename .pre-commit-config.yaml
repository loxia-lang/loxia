minimum_pre_commit_version: "4.0.0"
fail_fast: true
# Without this, hooks without an explicit `stages` also run on commit-msg, so the
# whole suite ran twice per commit.
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: env UV_CACHE_DIR=.uv-cache uv run ruff check .
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-format
        name: ruff format
        entry: env UV_CACHE_DIR=.uv-cache uv run ruff format .
        language: system
        pass_filenames: false
        always_run: true

      - id: mypy
        name: mypy strict
        entry: env UV_CACHE_DIR=.uv-cache uv run mypy
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest
        name: pytest (no native backend; pre-push)
        # The backend builds a binary per case (~4 min) and is covered by CI on every
        # push and pull request. `make check` still runs the full suite. The fast
        # suite (no backend/install, xdist) takes ~15 s, but still runs on pre-push,
        # not on every commit.
        entry: env UV_CACHE_DIR=.uv-cache uv run pytest -m "not backend and not install" -n auto -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: conventional-commit
        name: conventional commit message
        entry: env UV_CACHE_DIR=.uv-cache uv run python tools/check_commit_msg.py
        language: system
        stages: [commit-msg]
