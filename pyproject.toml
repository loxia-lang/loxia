[project]
name = "lox"
version = "1.0.0"
description = "Interpretador Lox em Python (Crafting Interpreters) rumo a uma linguagem própria compilada com LLVM"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
# Backend nativo (ADR-0031). O interpretador continua sem dependências: `uv sync`
# instala só o runtime; `uv sync --extra llvm` habilita `--emit` e os testes do backend.
llvm = ["llvmlite>=0.50"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "bench: benchmarks lentos, não rodam na suíte padrão",
    "backend: compila e executa binários nativos (precisa de llvmlite e de um cc)",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# E501: deixamos o formatador cuidar de largura; não falhamos build por linha longa.
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "lox", "main.py", "tests", "bench"]

[[tool.mypy.overrides]]
# llvmlite não publica stubs; a fronteira é `src/backend/llvm_ir.py`.
module = ["llvmlite.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*", "bench.*"]
# Testes e benchmarks podem ter helpers sem anotação; o código de produção não.
disallow_untyped_defs = false
disallow_untyped_calls = false
