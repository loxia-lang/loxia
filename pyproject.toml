[project]
name = "lox"
version = "0.1.0"
description = "Interpretador Lox em Python (Crafting Interpreters) rumo a uma linguagem própria compilada com LLVM"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["bench: benchmarks lentos, não rodam na suíte padrão"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# E501: deixamos o formatador cuidar de largura; não falhamos build por linha longa.
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
# O `Interpreter` ainda não implementa todos os nós do visitor (caps. 10–13).
# Remover esta linha quando funções/classes/herança estiverem prontas.
disable_error_code = ["abstract"]
files = ["src", "main.py", "tests", "bench"]

[[tool.mypy.overrides]]
module = ["tests.*", "bench.*"]
# Testes e benchmarks podem ter helpers sem anotação; o código de produção não.
disallow_untyped_defs = false
disallow_untyped_calls = false
