[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "loxia"
version = "1.1.0"
description = "Loxia: a small, statically checked language descended from Lox, with a tree-walk interpreter and an optional LLVM backend"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
requires-python = ">=3.13"
dependencies = []
authors = [{ name = "Cassio Dalla" }]
keywords = [
    "language",
    "interpreter",
    "compiler",
    "llvm",
    "lox",
    "loxia",
    "programming-language",
    "tree-walk",
]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Interpreters",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/loxia-lang/loxia"
Repository = "https://github.com/loxia-lang/loxia"
Issues = "https://github.com/loxia-lang/loxia/issues"
Changelog = "https://github.com/loxia-lang/loxia/blob/main/CHANGELOG.md"

[project.scripts]
loxia = "loxia.cli:main"
loxia-mcp = "loxia.mcp:main"

[project.optional-dependencies]
# Backend nativo (ADR-0031). O interpretador continua sem dependências: `uv sync`
# instala só o runtime; `uv sync --extra llvm` habilita `--emit` e os testes do backend.
llvm = ["llvmlite>=0.50"]

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not install'"
markers = [
    "bench: benchmarks lentos, não rodam na suíte padrão",
    "backend: compila e executa binários nativos (precisa de llvmlite, cc e libgc)",
    "install: builda o wheel e instala num venv fora do repo (lento; rode com `pytest -m install`)",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# E501: deixamos o formatador cuidar de largura; não falhamos build por linha longa.
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["loxia_core", "loxia", "main.py", "tests", "bench", "editors", "tools"]

[[tool.mypy.overrides]]
# llvmlite não publica stubs; a fronteira é `loxia_core/backend/llvm_ir.py`.
module = ["llvmlite.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*", "bench.*"]
# Testes e benchmarks podem ter helpers sem anotação; o código de produção não.
disallow_untyped_defs = false
disallow_untyped_calls = false

[tool.hatch.build.targets.wheel]
packages = ["loxia", "loxia_core"]

# O wheel precisa levar a stdlib e o runtime C: eles são resolvidos por
# `loxia_core.bundle` (dev: raiz do repo; instalado: dentro do pacote). ADR-0088.
[tool.hatch.build.targets.wheel.force-include]
"std" = "loxia_core/std"
"runtime" = "loxia_core/runtime"
"NOTICE" = "NOTICE"

[tool.hatch.build.targets.sdist]
# O wheel materializa `loxia_core/std` e `loxia_core/runtime` como force-include;
# se um build em andamento deixar a cópia na árvore, a sdist não pode capturá-la
# (o teste de instalação exige um `std/` só, na raiz).
exclude = [
    ".uv-cache",
    ".uv-cache/**",
    ".venv",
    ".venv/**",
    "build",
    "dist",
    "loxia_core/std",
    "loxia_core/std/**",
    "loxia_core/runtime",
    "loxia_core/runtime/**",
]
include = [
    "loxia",
    "loxia_core",
    "std",
    "runtime",
    "tests",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "NOTICE",
    "CHANGELOG.md",
    "pyproject.toml",
]
